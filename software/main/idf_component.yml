## IDF Component Manager Manifest File
dependencies:

  espressif/esp_lcd_st77916: ^2.0.2


  78/esp-wifi-connect: ~3.2.2
  espressif/esp_audio_effects: ~1.3.0
  espressif/esp_audio_codec: ~2.5.0
  78/esp-ml307: ~3.6.6

# 0.6.1 requires ESP-IDF >= 6.0.1. Keep 0.6.0 so the shared
# NT26/4G implementation remains buildable with ESP-IDF 5.5.2.
  78/uart-eth-modem: ==0.6.0

  78/xiaozhi-fonts: ~2.0.0
  espressif/led_strip: ~3.0.2
  espressif/esp_codec_dev: ~1.5.6
  espressif/esp-sr: ~2.4.7
  espressif/button: ~4.2.0
  espressif/knob: ^1.0.0

  espressif/esp32-camera: ^2.1.6

  espressif/esp_video: ^2.3.0

  espressif/esp_image_effects: ^1.0.1

  espressif/esp_lcd_touch_cst816s: ^1
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.8.0
  espressif/esp_io_expander_tca95xx_16bit: ^2.0.0
  espressif2022/image_player: ^1.1.1
  espressif2022/esp_emote_expression: ^1.0.2
  espressif/esp_mmap_assets: ^1.3.2
  txp666/otto-emoji-gif-component: ^1.3.0

  espressif/adc_battery_estimation: ^0.2.1
  espressif/esp_new_jpeg: ^1.0.2

  # SenseCAP Watcher Board
  

  espressif/bmi270_sensor: 0.1.2

  espressif/touch_slider_sensor:
    version: ^0.2.0~1
    rules:
    # The conditions specified in 'rules' with 'if' are combined with 'and'
    - if: target in [esp32s3]
    - if: idf_version < 6.0.0

  espressif/touch_button_sensor:
    version: ^0.2.2~1
    rules:
    - if: target in [esp32s3]
    - if: idf_version < 6.0.0

  espressif/iot_usbh_rndis: ^0.3.1


  espressif/bq27220:
    public: true
    version: '*'

  ## Required IDF version
  idf:
    version: '>=5.5.2'


